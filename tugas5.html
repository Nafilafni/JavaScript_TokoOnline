<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tugas 5 JS - Manajemen Produk</title>
  <style>
/* Dasar */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f6f3ee;
  color: #2b2b2b;
  margin: 0;
  padding: 40px 16px;
}

.container {
  max-width: 680px;
  margin: 0 auto;
}

h1 {
  font-size: 28px;
  margin: 0 0 28px;
  padding-bottom: 12px;
  border-bottom: 3px solid #1f6f5c;
}

/* Kartu */
.card {
  background: #ffffff;
  padding: 24px;
  margin-bottom: 24px;
  border: 1px solid #e6e1d8;
  border-radius: 14px;
}

.card h2 {
  font-size: 13px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #7a7466;
  margin: 0 0 16px;
}

/* Form */
.form-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

input {
  flex: 1;
  min-width: 140px;
  padding: 11px 14px;
  border: 1px solid #d9d3c7;
  border-radius: 8px;
  background: #fdfcfa;
  font-size: 14px;
}

input:focus {
  outline: none;
  border-color: #1f6f5c;
}

input.kecil {
  flex: 0 0 80px;
  min-width: 80px;
}

button {
  padding: 11px 20px;
  border: none;
  border-radius: 8px;
  background: #1f6f5c;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

button:hover {
  background: #185646;
}

/* Tombol hapus: outline merah, penuh saat di-hover */
button.hapus {
  padding: 6px 14px;
  background: transparent;
  border: 1px solid #c0392b;
  color: #c0392b;
  font-size: 13px;
}

button.hapus:hover {
  background: #c0392b;
  color: white;
}

/* Tabel */
table {
  width: 100%;
  border-collapse: collapse;
}

th {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #7a7466;
}

th,
td {
  padding: 12px 8px;
  text-align: left;
  border-bottom: 1px solid #eee9df;
}

tbody tr:last-child td {
  border-bottom: none;
}

th:nth-child(3),
td.harga {
  text-align: right;
}

th:nth-child(4),
td:last-child {
  text-align: right;
}

td.kosong {
  text-align: center;
  color: #9a9486;
}

#pesan {
  margin-top: 10px;
  color: #c0392b;
  font-size: 13px;
}

</style>
</head>
<body>
  <div class="container">
    <h1>Manajemen Produk</h1>

    <div class="card">
      <h2>Tambah Produk</h2>
      <form id="formTambah" class="form-row">
        <input type="number" id="inputId" class="kecil" placeholder="ID" min="1" required>
        <input type="text" id="inputNama" placeholder="Nama produk" required>
        <input type="number" id="inputHarga" placeholder="Harga (Rp)" min="0" required>
        <button type="submit">Tambah</button>
      </form>
      <div id="pesan"></div>
    </div>

    <div class="card">
      <h2>Daftar Produk</h2>
      <table>
        <thead>
          <tr><th>ID</th><th>Nama</th><th>Harga</th><th></th></tr>
        </thead>
        <tbody id="daftarProduk"></tbody>
      </table>
    </div>
  </div>

  <script>
    // Data Produk
    let produkList = [
      { id: 1, nama: "Laptop", harga: 12000000 },
      { id: 2, nama: "Smartphone", harga: 5000000 },
      { id: 3, nama: "Headphone", harga: 750000 },
      { id: 4, nama: "Keyboard", harga: 450000 },
      { id: 5, nama: "Mouse", harga: 250000 }
    ];

    const formatRupiah = (angka) => "Rp" + angka.toLocaleString("id-ID");

    // ID berikutnya = ID terbesar + 1 (dipakai untuk mengisi kolom ID otomatis)
    const idBerikutnya = () =>
      produkList.length ? Math.max(...produkList.map((p) => p.id)) + 1 : 1;

    // nama fungsi bebas
    const eventHandler = {
      tambah(event) {
        event.preventDefault();
        const id = Number(document.getElementById("inputId").value);
        const nama = document.getElementById("inputNama").value.trim();
        const harga = Number(document.getElementById("inputHarga").value);
        const pesan = document.getElementById("pesan");

        if (produkList.some((p) => p.id === id)) {
          pesan.textContent = `ID ${id} sudah dipakai, gunakan ID lain.`;
          return;
        }
        pesan.textContent = "";
        tambahProduk(id, nama, harga);
        event.target.reset();
        tampilkanProduk();
      },
      hapus(event) {
        // event delegation: listener di tbody, tombol dikenali lewat event.target
        const tombol = event.target.closest("button[data-id]");
        if (!tombol) return;
        hapusProduk(Number(tombol.dataset.id));
        tampilkanProduk();
      }
    };

    // Menambahkan Produk dengan Spread Operator
    function tambahProduk(id, nama, harga) {
      produkList = [...produkList, { id, nama, harga }];
    }

    // Menghapus Produk dengan Rest Parameter
    function hapusProduk(...idHapus) {
      produkList = produkList.filter((produk) => !idHapus.includes(produk.id));
    }

    // Menampilkan Produk dengan Destructuring
    function tampilkanProduk() {
      const tbody = document.getElementById("daftarProduk");

      if (produkList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="kosong">Belum ada produk</td></tr>';
      } else {
        tbody.innerHTML = produkList
          .map(({ id, nama, harga }) => `
            <tr>
              <td>${id}</td>
              <td>${nama}</td>
              <td class="harga">${formatRupiah(harga)}</td>
              <td><button class="hapus" data-id="${id}">Hapus</button></td>
            </tr>`)
          .join("");
      }

      // isi otomatis kolom ID dengan ID berikutnya
      document.getElementById("inputId").value = idBerikutnya();

      console.log("=== Daftar Produk ===");
      produkList.forEach(({ id, nama, harga }) => {
        console.log(`${id}. ${nama} - ${formatRupiah(harga)}`);
      });
    }

    // Event Listener
    document.getElementById("formTambah").addEventListener("submit", eventHandler.tambah);
    document.getElementById("daftarProduk").addEventListener("click", eventHandler.hapus);

    tampilkanProduk();
    // contoh penambahan data
    tambahProduk(6, "Tablet", 7000000);
    tampilkanProduk();
    hapusProduk(2);
    tampilkanProduk();
  </script>
</body>
</html>
